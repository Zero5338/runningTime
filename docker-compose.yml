# 로컬 개발용 PostgreSQL: docker compose up -d
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: runnershigh
      POSTGRES_PASSWORD: runnershigh
      POSTGRES_DB: runnershigh
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
